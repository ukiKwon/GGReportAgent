<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금고은행 입찰 현황 히트맵</title>
<style>
  :root { --bg:#0f1420; --panel:#1a2233; --line:#2a3550; --fg:#e6ecff; --muted:#8a97b8;
          --red:#e5484d; --orange:#f5a524; --yellow:#f2e14c; --blue:#3b82f6; --gray:#8a97b8; }
  * { box-sizing:border-box; }
  /* 남는 높이를 지도가 flex로 채운다 — 예전 calc(100vh - 120px)는 상단바가 한 줄일 때만
     맞아서, 필터 제목이 붙어 두 줄이 되자 지도(와 우하단 범례)가 화면 밖으로 밀렸다. */
  html, body { height:100%; }
  body { margin:0; font-family:"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg);
         display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  .tabs { display:flex; gap:4px; margin-left:auto; }
  .tab-btn { background:var(--panel); color:var(--muted); border:1px solid var(--line);
             padding:6px 14px; border-radius:8px 8px 0 0; cursor:pointer; }
  .tab-btn.active { color:var(--fg); border-bottom-color:var(--panel); }
  .tab-view { display:none; padding:12px 16px; flex:1 1 auto; min-height:0; }
  .tab-view.active { display:flex; flex-direction:column; }
  #tab-regions.active { overflow:auto; }
  #drill-wrap { flex:1 1 auto; min-height:0; }
  #map-stage { position:relative; width:100%; height:100%; background:var(--panel);
               border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  #cloud-overlay { position:absolute; inset:0; background:radial-gradient(circle at 50% 45%, rgba(15,20,32,0) 0%, rgba(15,20,32,0.85) 70%);
                   opacity:0; pointer-events:none; transition:opacity .7s ease; }
  #cloud-overlay.active { opacity:1; }
  #breadcrumb { position:absolute; top:10px; left:12px; color:var(--fg); z-index:5; }
  #breadcrumb button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  .rank-card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:6px; cursor:pointer; }
  .rank-card.hi { outline:2px solid #fff; }
  #rank-panel { max-height:100%; }
  .rank-head { display:flex; gap:8px; align-items:center; margin:4px 0 10px; flex-wrap:wrap; }
  .rank-head select, .rank-head .rk-type { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-size:12px; }
  .heart { cursor:pointer; float:right; }
  .marker.hi > * { stroke:#fff; stroke-width:2.5; }
  .miss { color:var(--red); font-weight:bold; }
  #pin-bar { display:flex; gap:8px; flex-wrap:wrap; min-height:36px; margin-bottom:12px; }
  .pin { background:#243; border:1px solid #3a6; color:#cfe; border-radius:16px; padding:4px 12px; cursor:grab; }
  #region-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .rg-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .rg-card .star { cursor:pointer; float:right; }
  .region.watched { stroke:#ffe066; stroke-width:3; filter:drop-shadow(0 0 6px #ffe066); }
  /* 물결·구 외곽선 깜빡임은 색/주기를 공유한다 — 설정 UI 하나로 같이 조절됨.
     render.applyTheme()이 --accent-color / --ripple-duration 을 덮어쓴다. */
  @keyframes ripple { from { r:6; opacity:.85; } to { r:26; opacity:0; } }
  .ripple-ring { fill:none; stroke:var(--accent-color); stroke-width:3;
                 animation: ripple var(--ripple-duration) ease-out infinite; pointer-events:none; }
  @keyframes muni-blink {
    0%,100% { stroke-opacity:1; stroke-width:4; }
    50%     { stroke-opacity:.30; stroke-width:2; }
  }
  /* 지자체 선택 시 해당 구 외곽선만 깜빡 (물결 대신) */
  .subregion.selected { stroke:var(--accent-color);
                        animation: muni-blink var(--ripple-duration) ease-in-out infinite; }
  /* 지역명 라벨: 지역마다 색을 달리하지 않고 균일한 진한 글자 + 연한 헤일로로 통일.
     paint-order:stroke 가 핵심 — 없으면 외곽선이 글자를 덮어 뭉개진다. */
  .label { paint-order:stroke; stroke:#f7f9ff; stroke-width:3px; stroke-linejoin:round;
           fill:#141b2b; font-size:13px; font-weight:700; }
  .label .sub { font-size:10px; font-weight:600; fill:#4a5570; }
  /* 범례: 지도 우하단 오버레이. pointer-events:none 이라 지도 클릭을 막지 않는다. */
  #legend { position:absolute; right:12px; bottom:12px; z-index:6; pointer-events:none;
            background:rgba(26,34,51,.88); border:1px solid var(--line); border-radius:8px;
            padding:8px 10px; font-size:12px; display:flex; flex-direction:column; gap:5px; }
  #legend .lg-title { color:var(--muted); font-size:10px; letter-spacing:.04em; margin-bottom:1px; }
  #legend .lg-item { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  #legend .lg-sw { width:13px; height:13px; border-radius:3px; border:1px solid rgba(0,0,0,.35); display:inline-block; }
  #legend .lg-hatch { background-image:repeating-linear-gradient(45deg, rgba(15,20,32,.55) 0 2px, transparent 2px 4px); }
  .filter-title { font-size:10px; color:var(--muted); letter-spacing:.04em; margin-bottom:3px; }
  #theme-modal label { display:flex; align-items:center; gap:8px; margin:8px 0; }
  #theme-modal input[type=color] { width:44px; height:26px; padding:0; border:1px solid var(--line); background:none; }

  /* ── 내 프로필·쪽지함 버튼 (계획 C2) ── */
  .me-box { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
  .me-box input, .me-box select { background:var(--bg); color:var(--fg);
      border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-size:12px; }
  #btn-notify { background:var(--panel); color:var(--fg); border:1px solid var(--line);
      border-radius:6px; padding:4px 10px; cursor:pointer; }
  #notify-badge:not(:empty) { margin-left:5px; background:var(--red); color:#fff;
      border-radius:9px; padding:0 6px; font-size:11px; }

  /* ── 워크플로 현황판 (계획 C1) — 색은 전부 기존 CSS 변수로 ── */
  #tab-workflow.active { overflow:auto; gap:12px; }
  #wf-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #wf-controls select, #wf-controls input { background:var(--bg); color:var(--fg);
      border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:13px; }
  #wf-controls button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
      border-radius:6px; padding:4px 12px; cursor:pointer; }
  #wf-controls button[disabled] { opacity:.45; cursor:not-allowed; }
  .wf-stepper { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 8px; }
  .wf-step { background:var(--panel); border:1px solid var(--line); border-radius:8px;
             padding:6px 10px; font-size:12px; color:var(--muted); display:flex; gap:6px;
             align-items:center; cursor:pointer; }
  .wf-step b { background:var(--bg); border-radius:50%; width:18px; height:18px;
               display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
  .wf-step.done { color:var(--fg); border-color:var(--blue); }
  .wf-step.current { color:var(--fg); border-color:var(--accent-color); box-shadow:0 0 0 1px var(--accent-color); }
  .wf-step.gate { color:var(--fg); border-color:var(--orange); box-shadow:0 0 0 1px var(--orange); }
  .wf-step .wf-gate { font-style:normal; font-size:10px; color:var(--orange); }
  /* 그 단계에 기록된 이벤트 건수 — 클릭하면 아래 로그 영역에 펼쳐진다 */
  .wf-step .wf-cnt { font-style:normal; font-size:10px; color:var(--fg); background:var(--bg);
                     border-radius:8px; padding:0 6px; }
  .wf-step.sel { outline:2px solid var(--accent-color); }
  .wf-state { font-size:13px; margin:6px 0; }
  .wf-cards-title { font-size:13px; margin:10px 0 2px; }
  .wf-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin:8px 0; }
  /* 그 단계에서 한 일 요약 — 길면 말줄임(전체 문구는 title 속성) */
  .wf-card .wf-card-sum { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wf-card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
             padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
  .wf-card.hi { outline:2px solid var(--accent-color); }
  .wf-card span { font-size:12px; color:var(--muted); }
  .wf-empty { color:var(--muted); font-size:12px; }
  .wf-sum { font-size:12px; color:var(--muted); }
  .wf-cov { border-collapse:collapse; width:100%; font-size:12px; margin-top:6px; }
  .wf-cov th, .wf-cov td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  .wf-cov th { color:var(--muted); font-weight:600; }
  .wf-cov tr.ok td:first-child { border-left:3px solid var(--blue); }
  .wf-cov tr.gap td:first-child { border-left:3px solid var(--orange); }
  .wf-cov tr.none td:first-child { border-left:3px solid var(--red); }
  /* 작성됨/미충족/미배정 상태 배지 — 색은 기존 변수만 쓰고 배경만 옅게 섞는다 */
  .wf-badge { border-radius:10px; padding:1px 8px; font-size:11px; border:1px solid; white-space:nowrap; }
  .wf-badge.ok   { color:var(--blue);   border-color:var(--blue);   background:color-mix(in srgb, var(--blue) 20%, transparent); }
  .wf-badge.gap  { color:var(--orange); border-color:var(--orange); background:color-mix(in srgb, var(--orange) 20%, transparent); }
  .wf-badge.none { color:var(--red);    border-color:var(--red);    background:color-mix(in srgb, var(--red) 20%, transparent); }
  /* 정합성 경고 (계획 E) — 어긋난 게 없으면 아예 그리지 않는다 */
  .wf-warn { margin:10px 0; }
  .wf-warn-row { border:1px solid var(--red); border-radius:8px; padding:8px 10px;
                 margin-bottom:6px; font-size:12px;
                 background:color-mix(in srgb, var(--red) 14%, transparent); }
  /* 참여 결정 3차 결재 (계획 D) */
  #wf-participation .wf-cov tr.done td { color:var(--muted); }
  #wf-participation .wf-cov tr.current td { border-left:3px solid var(--accent-color); }
  .wf-dec { background:var(--bg); color:var(--fg); border:1px solid var(--line);
            border-radius:6px; padding:2px 12px; cursor:pointer; margin-right:4px; }
  .wf-log { margin-top:10px; }
  .wf-log-title { font-size:13px; margin:6px 0 2px; }
  .wf-log-row { border-top:1px solid var(--line); padding:6px 0; font-size:12px; }
  .wf-log-row .wf-who { color:var(--muted); font-size:11px; }
  /* 역할 옆 한글 부제 — 총괄 agent / 영업 agent / 김 차장 */
  .wf-log-row .wf-sub { color:var(--fg); background:var(--panel); border:1px solid var(--line);
                        border-radius:8px; padding:0 6px; margin-left:5px; }

  /* ── 대화창 (계획 C2) ── */
  #tab-chat.active { overflow:hidden; gap:8px; }
  #ch-log { flex:1 1 auto; min-height:0; overflow:auto; border:1px solid var(--line);
            border-radius:10px; background:var(--panel); padding:10px; }
  .ch-row { margin:8px 0; max-width:78%; }
  .ch-row.mine { margin-left:auto; text-align:right; }
  .ch-row .ch-who { color:var(--muted); font-size:11px; margin-bottom:2px; }
  .ch-row pre { margin:0; white-space:pre-wrap; word-break:break-word; font-family:inherit;
                font-size:13px; background:var(--bg); border:1px solid var(--line);
                border-radius:10px; padding:8px 10px; text-align:left; }
  .ch-row.agent pre { border-color:var(--accent-color); }
  /* 답변처럼 생겼지만 답변이 아니다 — LLM 호출 실패 사유(계획 F 후속 G1) */
  .ch-row.failed pre { border-color:var(--red); color:var(--muted); }
  #ch-form { display:flex; gap:8px; align-items:flex-end; }
  #ch-input { flex:1 1 auto; background:var(--bg); color:var(--fg); border:1px solid var(--line);
              border-radius:8px; padding:8px; font-family:inherit; font-size:13px; resize:vertical; }
  #ch-form button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
                    border-radius:6px; padding:8px 14px; cursor:pointer; }
  #ch-form button[disabled] { opacity:.45; cursor:not-allowed; }

  /* ── 쪽지함 (계획 C2) — 종류별 색은 기존 변수만 사용 ── */
  #nt-form input { background:var(--bg); color:var(--fg); border:1px solid var(--line);
                   border-radius:6px; padding:5px 8px; font-size:13px; }
  #nt-form button { background:var(--bg); color:var(--fg); border:1px solid var(--line);
                    border-radius:6px; padding:5px 12px; cursor:pointer; }
  .nt-row { border-bottom:1px solid var(--line); padding:8px 0; }
  .nt-row.read { opacity:.5; }
  .nt-head { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .nt-head .nt-read { margin-left:auto; background:var(--bg); color:var(--fg);
                      border:1px solid var(--line); border-radius:6px; padding:1px 8px;
                      font-size:11px; cursor:pointer; }
  .nt-row pre { margin:3px 0 0; white-space:pre-wrap; word-break:break-word;
                font-family:inherit; font-size:13px; }
  .nt-kind { border-radius:10px; padding:1px 8px; font-size:11px; border:1px solid; }
  .nt-kind.approval { color:var(--orange); border-color:var(--orange); background:color-mix(in srgb, var(--orange) 20%, transparent); }
  .nt-kind.risk     { color:var(--red);    border-color:var(--red);    background:color-mix(in srgb, var(--red) 20%, transparent); }
  .nt-kind.handoff  { color:var(--blue);   border-color:var(--blue);   background:color-mix(in srgb, var(--blue) 20%, transparent); }
  .nt-kind.note     { color:var(--muted);  border-color:var(--line);   background:var(--bg); }

  /* ── 지식 탭 (계획 C2) ── */
  #tab-knowledge.active { overflow:auto; gap:8px; }
  #kn-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #kn-controls input, #kn-controls select { background:var(--bg); color:var(--fg);
      border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:13px; }
  #kn-controls button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
      border-radius:6px; padding:4px 12px; cursor:pointer; }
  .kn-hit { background:var(--panel); border:1px solid var(--line); border-radius:10px;
            padding:10px; margin:8px 0; }
  .kn-head { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .kn-head b { color:var(--fg); }
  .kn-snip { font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .kn-snip mark { background:var(--accent-color); color:var(--bg); border-radius:3px; padding:0 2px; }
  /* 지금이 하이브리드인지 FTS 단독인지 — 조용히 나빠지는 것을 막는 표시(계획 F) */
  .kn-mode { font-size:11px; border-radius:10px; padding:1px 8px; margin-left:6px;
             border:1px solid var(--line); cursor:help; }
  .kn-mode.on { border-color:var(--accent-color); color:var(--accent-color); }
  .kn-mode.off { color:var(--muted); }
  #kn-controls button:disabled { opacity:.55; cursor:progress; }
  .kn-hit { cursor:pointer; }
  .kn-hit:hover { border-color:var(--accent-color); }
  .kn-open { font-size:11px; color:var(--muted); float:right; }
  /* 원문 모달: 검색어는 노랑, 검색에 걸린 그 청크는 테두리로 표시 */
  #doc-body pre { margin:0; white-space:pre-wrap; word-break:break-word; font-family:inherit;
                  font-size:13px; line-height:1.6; }
  #doc-body mark { background:var(--accent-color); color:var(--bg); border-radius:3px; padding:0 2px; }
  #doc-body mark.kn-chunk { background:transparent; color:inherit;
                            box-shadow:inset 0 0 0 1px var(--accent-color); border-radius:4px; }
  .wf-log-row pre { margin:2px 0 0; white-space:pre-wrap; word-break:break-word; font-family:inherit; }
</style>
</head>
<body>
<header>
  <h1>금고은행 입찰 현황 히트맵</h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="map">전국 지도</button>
    <button class="tab-btn" data-tab="regions">전국 지역별</button>
    <!-- 워크플로 탭 — 서버 모드 전용. file:// 폴백에서는 app.applyServerModeUI가 숨긴다. -->
    <button class="tab-btn" data-tab="workflow" id="tab-btn-workflow" style="display:none;">워크플로</button>
    <button class="tab-btn" data-tab="chat" id="tab-btn-chat" style="display:none;">대화</button>
    <button class="tab-btn" data-tab="knowledge" id="tab-btn-knowledge" style="display:none;">지식</button>
  </div>
</header>

  <div id="topbar" style="display:flex;gap:16px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;">
    <div id="type-filter-wrap">
      <div class="filter-title">기관 분류선택</div>
      <div id="type-filter" style="display:flex;gap:10px;font-size:13px;">
        <label><input type="checkbox" data-type="지자체" checked> ▬ 지자체(면)</label>
        <label><input type="checkbox" data-type="공공기관" checked> ▲ 공공기관</label>
        <label><input type="checkbox" data-type="공기업" checked> ■ 공기업</label>
        <label><input type="checkbox" data-type="대학병원" checked> ● 대학병원</label>
        <label><input type="checkbox" data-type="대학교" checked> ⬟ 대학교</label>
      </div>
    </div>
    <button id="btn-add" style="background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;">＋ 기관 추가</button>
    <button id="btn-tmpl" style="background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;">CSV 템플릿 내려받기</button>
    <label style="background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;">CSV 업로드<input id="file-csv" type="file" accept=".csv" style="display:none;"></label>
    <button id="btn-export" style="background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;">기관 정보 내보내기</button>
    <button id="btn-theme" style="background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;">🎨 지도 색상</button>
    <!-- 내 프로필 — 쪽지함 조회 키(소속·이름)이자 결재자 이름 기본값 (계획 C2) -->
    <label class="me-box">나:
      <input id="me-name" placeholder="이름" size="8">
      <!-- 소속은 자유 입력이다 — 쪽지 수신자가 DB에서 자유 문자열이라 목록에 없는 값도 쓴다 -->
      <input id="me-team" list="me-teams" placeholder="소속" size="8">
      <datalist id="me-teams">
        <option>영업팀</option><option>전산팀</option><option>예산팀</option>
        <option>디자이너</option><option>인사권자</option>
      </datalist>
      <!-- 계정 전환 — 데모 모드에서만 보인다(GET /accounts의 demo 플래그) -->
      <select id="me-switch" style="display:none;" title="계정 전환(데모 전용)"></select>
    </label>
    <button id="btn-notify" title="쪽지함">✉ 쪽지함<span id="notify-badge"></span></button>
    <div id="ticker" style="margin-left:auto;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;max-width:40vw;"></div>
  </div>

<section id="tab-map" class="tab-view active">
  <div id="drill-wrap" style="display:flex;gap:12px;">
    <div id="map-stage" style="flex:2;position:relative;">
      <svg id="map-svg" width="100%" height="100%"></svg>
      <div id="cloud-overlay"></div>
      <div id="legend"></div>
      <div id="breadcrumb" style="display:none;"><button id="btn-back">← 전국</button> <span id="crumb-region"></span></div>
    </div>
    <div id="rank-panel" style="flex:1;display:none;overflow:auto;"></div>
  </div>
  <div id="popover" style="display:none;position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;max-width:280px;"></div>
  <div id="more-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;">
    <div style="max-width:720px;margin:6vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:84vh;display:flex;flex-direction:column;">
      <div style="display:flex;gap:10px;align-items:center;">
        <h3 style="margin:0;flex:0 0 auto;">전체 입찰건</h3>
        <input id="more-search" placeholder="기관명·지역·유형 검색" style="flex:1;padding:6px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;">
        <button id="more-close" style="background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;">닫기</button>
      </div>
      <div style="overflow:auto;margin-top:10px;">
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr style="text-align:left;color:var(--muted);">
            <th style="padding:6px;">기관명</th><th style="padding:6px;">기관구분</th><th style="padding:6px;">지역</th><th style="padding:6px;">입찰예상일</th><th style="padding:6px;">입찰주기</th><th style="padding:6px;">수정일</th>
          </tr></thead>
          <tbody id="more-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<section id="tab-regions" class="tab-view">
  <div id="pin-bar"></div>
  <div id="region-grid"></div>
</section>

<section id="tab-workflow" class="tab-view">
  <div id="wf-controls"></div>
  <div id="wf-warn"></div>
  <div id="wf-participation"></div>
  <div id="wf-panel"></div>
  <div id="wf-coverage"></div>
  <div id="wf-log"></div>
</section>

<section id="tab-chat" class="tab-view">
  <div id="ch-controls"></div>
  <div id="ch-log"></div>
  <div id="ch-form">
    <textarea id="ch-input" rows="2" placeholder="참여 여부·근거를 물어보세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <button id="ch-send">보내기</button>
    <button id="ch-stop" style="display:none;">중단</button>
  </div>
</section>

<section id="tab-knowledge" class="tab-view">
  <div id="kn-controls"></div>
  <div id="kn-results"></div>
</section>

<!-- 쪽지함 (계획 C2) — 기존 모달 관행과 같은 구조 -->
<div id="notify-modal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;">
  <div style="max-width:560px;margin:6vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:82vh;display:flex;flex-direction:column;">
    <h3 style="margin-top:0;">✉ 쪽지함 <span id="nt-me" style="font-size:12px;color:var(--muted);font-weight:normal;"></span></h3>
    <div id="nt-list" style="flex:1 1 auto;overflow:auto;min-height:0;"></div>
    <div id="nt-form" style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;">
      <input id="nt-to" list="nt-recipients" placeholder="수신자(팀 또는 이름)" size="14">
      <datalist id="nt-recipients">
        <option>영업팀</option><option>전산팀</option><option>예산팀</option>
        <option>디자이너</option><option>인사권자</option>
      </datalist>
      <input id="nt-text" placeholder="보낼 내용" style="flex:1 1 200px;">
      <button id="nt-send">보내기</button>
      <button id="nt-close">닫기</button>
    </div>
  </div>
</div>

<!-- 원문 열기(계획 F 후속 G2). 검색은 200자 스니펫만 주는데, 근거를 인용하려면
     파일 전체를 봐야 한다. 본문만 스크롤하고 닫기는 항상 보이게 고정한다. -->
<div id="doc-modal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;">
  <div style="max-width:840px;margin:5vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:88vh;display:flex;flex-direction:column;">
    <h3 id="doc-title" style="margin-top:0;"></h3>
    <div id="doc-meta" style="font-size:12px;color:var(--muted);margin-bottom:8px;"></div>
    <div id="doc-body" style="flex:1 1 auto;overflow:auto;min-height:0;"></div>
    <div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px;text-align:right;">
      <button id="doc-close">닫기</button>
    </div>
  </div>
</div>

<!-- 필드가 12개라 높이 제한이 없으면 저장/취소가 화면 밖으로 밀려 닫을 수 없게 된다.
     필드 영역만 스크롤하고 버튼은 항상 보이게 고정한다. -->
<div id="edit-modal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;">
  <div style="max-width:360px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:84vh;display:flex;flex-direction:column;">
    <h3 style="margin-top:0;">기관 정보 변경</h3>
    <div id="edit-fields" style="overflow:auto;flex:1 1 auto;min-height:0;"></div>
    <p style="color:var(--muted);font-size:11px;">sources는 쉼표로 구분, 1개 이상 필수(조작 금지).</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="edit-cancel">취소</button><button id="edit-save">저장</button>
    </div>
  </div>
</div>

<div id="theme-modal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;">
  <div style="max-width:360px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:84vh;overflow:auto;">
    <h3 style="margin-top:0;">지도 색상 설정</h3>
    <p style="color:var(--muted);font-size:11px;margin-top:0;">임박 단계별 면 색과, 선택 강조(물결·구 외곽선 깜빡임)의 색·속도를 조절합니다.</p>
    <label>임박 6개월↓ <input type="color" data-t="red"></label>
    <label>임박 1년↓ <input type="color" data-t="orange"></label>
    <label>임박 2년↓ <input type="color" data-t="yellow"></label>
    <label>임박 2년+ <input type="color" data-t="blue"></label>
    <label>미상 <input type="color" data-t="gray"></label>
    <label>선택 강조색 <input type="color" data-t="accent"></label>
    <label>강조 주기 <input type="range" data-t="rippleDuration" min="1" max="4" step="0.2" style="flex:1;">
      <span id="theme-dur-val" style="width:42px;text-align:right;"></span></label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
      <button id="theme-reset">기본값으로 초기화</button>
      <button id="theme-cancel">취소</button><button id="theme-save">저장</button>
    </div>
  </div>
</div>

<div id="add-modal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;">
  <div style="max-width:420px;margin:6vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:84vh;overflow:auto;">
    <h3 style="margin-top:0;">기관 추가</h3>
    <div id="add-fields"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
      <button id="add-cancel">취소</button><button id="add-save">저장</button>
    </div>
  </div>
</div>

<!-- 렌더·엔트리 -->
<script src="js/render.js"></script>
<script src="js/app.js"></script>
<script>
  // 탭 전환 (와이어링은 app.js가 보강; 여기선 기본 토글 보장)
  document.querySelectorAll('.tab-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (x){ x.classList.remove('active'); });
      document.querySelectorAll('.tab-view').forEach(function (x){ x.classList.remove('active'); });
      b.classList.add('active');
      document.getElementById('tab-' + b.dataset.tab).classList.add('active');
      if (window.app && window.app.onTabChange) window.app.onTabChange(b.dataset.tab);
    });
  });
</script>
</body>
</html>
