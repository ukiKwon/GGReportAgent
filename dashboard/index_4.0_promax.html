<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금고은행 입찰 현황 히트맵 — promax 변형</title>
<style>
  /* ── ui-ux-pro-max 변형 (2026-08-13) ────────────────────────────────────
     비교 실험용 파일 — 정본은 index.html(HTS 터미널). 이 파일은 DB 추천
     "Data-Dense Dashboard / 블루 데이터 + 앰버 강조 / 라이트" 방향.
     Fira 폰트 추천은 폐쇄망이라 시스템 폰트(Malgun+Consolas)로 대체.
     변수명·클래스·id는 JS와 공유 — 값만 라이트 팔레트로 교체.
     지도 팔레트·티커/범례 글자색은 하단 인라인 스크립트가 덮어쓴다. */
  :root { --bg:#F6F8FC; --panel:#FFFFFF; --panel2:#EFF4FB; --line:#DBE5F4;
          --line-strong:#C3D2E8; --fg:#1C2B55; --muted:#64748B;
          --red:#DC2626; --orange:#D97706; --yellow:#B9860A; --blue:#2563EB; --gray:#94A3B8;
          --accent-color:#D97706; --ripple-duration:2.2s;
          --mono:Consolas,"Cascadia Mono","Malgun Gothic",monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Malgun Gothic","Segoe UI",sans-serif; font-size:13px;
         background:var(--bg); color:var(--fg); font-variant-numeric:tabular-nums;
         display:flex; flex-direction:column; overflow:hidden; }

  ::selection { background:#FDE6C4; color:#7A4A05; }
  * { scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  :focus-visible { outline:2px solid #1E40AF; outline-offset:2px; }
  input, select, textarea { accent-color:#1E40AF; caret-color:#1E40AF; }

  /* 공통 컨트롤 — 화이트 카드 + 블루 계열 보더, 150-300ms 전이 */
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line-strong);
           border-radius:8px; padding:6px 13px; font:inherit; font-size:12px; cursor:pointer;
           white-space:nowrap; box-shadow:0 1px 2px rgba(30,64,175,.06);
           transition:background .2s, border-color .2s, box-shadow .2s; }
  button:hover { background:#F4F8FF; border-color:#93B4E8; box-shadow:0 2px 6px rgba(30,64,175,.12); }
  button:active { background:#E9F0FC; box-shadow:none; }
  button[disabled] { opacity:.45; cursor:not-allowed; box-shadow:none; }
  .btn-like { background:var(--panel); color:var(--fg); border:1px solid var(--line-strong);
              border-radius:8px; padding:6px 13px; font-size:12px; cursor:pointer;
              display:inline-flex; align-items:center; white-space:nowrap;
              box-shadow:0 1px 2px rgba(30,64,175,.06);
              transition:background .2s, border-color .2s; }
  .btn-like:hover { background:#F4F8FF; border-color:#93B4E8; }
  input[type=text], input[type=date], input[type=number], input:not([type]), select, textarea {
    background:#FFFFFF; color:var(--fg); border:1px solid var(--line-strong);
    border-radius:6px; padding:5px 9px; font:inherit; font-size:12px; }

  /* 헤더 — 화이트 바, 네이비 제호, 언더라인 탭 */
  header { display:flex; align-items:center; gap:16px; padding:0 18px;
           background:#FFFFFF; border-bottom:1px solid var(--line); }
  header h1 { font-size:14px; font-weight:700; letter-spacing:-.01em; margin:0; padding:11px 0;
              color:#152452; display:flex; align-items:center; gap:8px; }
  header h1 svg { display:block; }
  .tabs { display:flex; gap:2px; margin-left:auto; align-self:stretch; }
  .tab-btn { background:transparent; color:var(--muted); border:none; border-radius:0;
             border-bottom:2px solid transparent; padding:0 15px; cursor:pointer;
             box-shadow:none; transition:color .2s, border-color .2s; }
  .tab-btn:hover { color:var(--fg); background:#F4F8FF; }
  .tab-btn.active { color:#1E40AF; border-bottom-color:#1E40AF; font-weight:600; }

  /* 컨트롤 스트립 */
  #topbar { display:flex; gap:14px; align-items:flex-end; padding:9px 18px;
            border-bottom:1px solid var(--line); background:#FFFFFF; flex-wrap:wrap; }
  .filter-title { font-size:10px; color:var(--muted); letter-spacing:.07em; margin-bottom:4px; }
  #type-filter-wrap { min-width:0; }
  #type-filter { display:flex; gap:6px 12px; font-size:12px; flex-wrap:wrap; }
  #type-filter label { display:flex; align-items:center; gap:4px; color:var(--fg); cursor:pointer;
                       white-space:nowrap; }
  #type-filter label:has(input:disabled) { opacity:.42; cursor:default; }
  .fsw { width:11px; height:11px; stroke:var(--muted); fill:none; stroke-width:1.4; }
  .fsw.fill { fill:var(--muted); stroke:none; }
  .tb-group { display:flex; gap:7px; align-items:center; }
  .tb-group button, #btn-notify { display:flex; align-items:center; gap:5px; }
  .tb-group svg, #btn-notify svg { display:block; }
  .me-box { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
  .me-box input, .me-box select { padding:4px 7px; }
  #notify-badge:not(:empty) { margin-left:2px; background:var(--red); color:#fff;
      border-radius:8px; padding:0 6px; font-size:11px; font-family:var(--mono); }

  /* 티커 — 앰버 하이라이트 밴드 (색은 JS 패치가 네이비 쪽 믹스로 칠한다) */
  #ticker-strip { border-bottom:1px solid #F3D9A8; background:#FFF8EA; padding:5px 18px; }
  #ticker { font-family:var(--mono); font-size:12px; color:#7A4A05;
            overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #ticker:empty::before { content:"…"; color:var(--muted); }
  #ticker .tk-cap { color:#A5793B; letter-spacing:.07em; margin-right:10px; }
  #ticker .tk-sep { color:#E3C68F; margin:0 9px; }
  .gph { width:12px; height:12px; display:inline-block; vertical-align:-2px; }
  #legend .gph { width:10px; height:10px; vertical-align:-1px; }

  .tab-view { display:none; padding:12px 18px; flex:1 1 auto; min-height:0; }
  .tab-view.active { display:flex; flex-direction:column; }
  #tab-regions.active { overflow:auto; }

  /* 지도 — 화이트 카드 판, 연청 바다 */
  #drill-wrap { flex:1 1 auto; min-height:0; display:flex; gap:12px; justify-content:center; }
  #drill-wrap:has(> #rank-panel[style*="none"]) #map-stage {
    max-width:calc((100vh - 150px) * 0.92); }
  #map-stage { flex:2; position:relative; width:100%; height:100%; background:#E8F0FA;
               border:1px solid var(--line); border-radius:10px; overflow:hidden;
               box-shadow:0 1px 3px rgba(30,64,175,.08), 0 8px 24px rgba(30,64,175,.06); }
  #cloud-overlay { position:absolute; inset:0; background:radial-gradient(circle at 50% 45%, rgba(246,248,252,0) 0%, rgba(246,248,252,.85) 70%);
                   opacity:0; pointer-events:none; transition:opacity .7s ease; }
  #cloud-overlay.active { opacity:1; }
  #breadcrumb { position:absolute; top:10px; left:10px; z-index:5;
                display:flex; gap:8px; align-items:center; }
  #crumb-region { font-family:var(--mono); font-size:12px; color:#1E40AF; font-weight:600; }
  .label { paint-order:stroke; stroke:#ffffff; stroke-width:3px; stroke-linejoin:round;
           fill:#12224e; font-size:13px; font-weight:700; }
  .label .sub { font-size:10px; font-weight:600; fill:#7385ab; }
  .region.watched { stroke:#B45309; stroke-width:3; filter:drop-shadow(0 0 5px rgba(217,119,6,.55)); }
  @keyframes ripple { from { r:6; opacity:.85; } to { r:26; opacity:0; } }
  .ripple-ring { fill:none; stroke:var(--accent-color); stroke-width:3;
                 animation: ripple var(--ripple-duration) ease-out infinite; pointer-events:none; }
  @keyframes muni-blink {
    0%,100% { stroke-opacity:1; stroke-width:4; }
    50%     { stroke-opacity:.30; stroke-width:2; }
  }
  .subregion.selected { stroke:var(--accent-color);
                        animation: muni-blink var(--ripple-duration) ease-in-out infinite; }
  .marker.hi > * { stroke:#12224e; stroke-width:2.5; }

  /* 범례 — 화이트 카드 */
  #legend { position:absolute; right:10px; bottom:10px; z-index:6; pointer-events:none;
            background:rgba(255,255,255,.94); border:1px solid var(--line);
            border-radius:8px; box-shadow:0 2px 8px rgba(30,64,175,.1);
            padding:8px 11px; font-size:11px; font-family:var(--mono);
            display:flex; flex-direction:column; gap:4px; }
  #legend .lg-title { color:var(--muted); font-size:10px; letter-spacing:.07em; margin-bottom:1px; }
  #legend .lg-item { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #legend .lg-sw { width:12px; height:12px; border-radius:3px; border:1px solid rgba(20,40,90,.18); display:inline-block; }
  #legend .lg-hatch { background-image:repeating-linear-gradient(45deg, rgba(120,140,175,.35) 0 2px, transparent 2px 4px); }

  /* 랭킹 — 화이트 테이블 카드, 호버 행 하이라이트 */
  #rank-panel { flex:1; display:none; overflow:auto; max-height:100%;
                background:var(--panel); border:1px solid var(--line);
                border-radius:10px; box-shadow:0 1px 3px rgba(30,64,175,.08); }
  .rank-head { display:flex; gap:8px; align-items:center; padding:8px 12px; margin:0;
               background:var(--panel2); border-bottom:1px solid var(--line);
               position:sticky; top:0; z-index:2; flex-wrap:wrap; }
  .rank-head b { font-size:12px; letter-spacing:.05em; color:#1E40AF; }
  .rank-head select, .rank-head .rk-type { padding:3px 7px; font-size:12px; }
  .rank-card { padding:8px 12px; margin:0; border-bottom:1px solid var(--line);
               cursor:pointer; transition:background .18s; }
  .rank-card:hover { background:#F4F8FF; }
  .rank-card.hi { background:#FFF3DC; box-shadow:inset 2px 0 0 var(--accent-color); }
  .rank-card b { font-size:13px; }
  .rank-card small { color:var(--muted); font-family:var(--mono); font-size:11px; }
  .heart { cursor:pointer; float:right; color:var(--red); }
  .miss { color:var(--red); font-weight:bold; }
  #rank-panel > div:last-child { padding:9px 12px; }
  #rank-more { width:100%; }

  /* 전국 지역별 */
  #pin-bar { display:flex; gap:7px; flex-wrap:wrap; min-height:34px; margin-bottom:10px; }
  .pin { background:#FFF3DC; border:1px solid #E8C580; color:#8A5606;
         border-radius:8px; padding:4px 11px; cursor:grab; font-size:12px; }
  #region-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:9px; }
  .rg-card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
             padding:12px 13px; box-shadow:0 1px 2px rgba(30,64,175,.06);
             transition:border-color .2s, box-shadow .2s; }
  .rg-card:hover { border-color:#93B4E8; box-shadow:0 4px 12px rgba(30,64,175,.12); }
  .rg-card .star { cursor:pointer; float:right; color:#D97706; }

  /* ── 서버 모드 탭·모달 — 토큰이 라이트 팔레트를 타고 흐른다 ── */
  #tab-workflow.active { overflow:auto; gap:12px; }
  #wf-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .wf-stepper { display:flex; gap:5px; flex-wrap:wrap; margin:12px 0 8px; }
  .wf-step { background:var(--panel); border:1px solid var(--line-strong); border-radius:8px;
             padding:6px 10px; font-size:12px; color:var(--muted); display:flex; gap:6px;
             align-items:center; cursor:pointer; }
  .wf-step b { background:var(--panel2); border-radius:5px; width:18px; height:18px;
               display:inline-flex; align-items:center; justify-content:center; font-size:11px;
               font-family:var(--mono); }
  .wf-step.done { color:var(--fg); border-color:var(--blue); }
  .wf-step.current { color:var(--fg); border-color:var(--accent-color); box-shadow:0 0 0 1px var(--accent-color); }
  .wf-step.gate { color:var(--fg); border-color:var(--orange); box-shadow:0 0 0 1px var(--orange); }
  .wf-step .wf-gate { font-style:normal; font-size:10px; color:var(--orange); }
  .wf-step .wf-cnt { font-style:normal; font-size:10px; color:var(--fg); background:var(--panel2);
                     border-radius:5px; padding:0 5px; font-family:var(--mono); }
  .wf-step.sel { outline:2px solid var(--accent-color); }
  .wf-state { font-size:13px; margin:6px 0; }
  .wf-cards-title { font-size:13px; margin:10px 0 2px; }
  .wf-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; margin:8px 0; }
  .wf-card .wf-card-sum { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wf-card { background:var(--panel); border:1px solid var(--line-strong); border-radius:8px;
             padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
  .wf-card.hi { outline:2px solid var(--accent-color); }
  .wf-card span { font-size:12px; color:var(--muted); }
  .wf-empty { color:var(--muted); font-size:12px; }
  .wf-sum { font-size:12px; color:var(--muted); }
  .wf-cov { border-collapse:collapse; width:100%; font-size:12px; margin-top:6px; }
  .wf-cov th, .wf-cov td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  .wf-cov th { color:var(--muted); font-weight:600; }
  .wf-cov tr.ok   { background:color-mix(in srgb, var(--blue) 7%, transparent); }
  .wf-cov tr.gap  { background:color-mix(in srgb, var(--orange) 8%, transparent); }
  .wf-cov tr.none { background:color-mix(in srgb, var(--red) 7%, transparent); }
  .wf-badge { border-radius:6px; padding:1px 7px; font-size:11px; border:1px solid; white-space:nowrap; }
  .wf-badge.ok   { color:#1D4ED8; border-color:#93B4E8; background:#EAF1FE; }
  .wf-badge.gap  { color:#92400E; border-color:#E8C580; background:#FFF3DC; }
  .wf-badge.none { color:#B91C1C; border-color:#F1B0B0; background:#FDECEC; }
  .wf-warn { margin:10px 0; }
  .wf-warn-row { border:1px solid #F1B0B0; border-radius:8px; padding:8px 10px;
                 margin-bottom:6px; font-size:12px; background:#FDECEC; }
  #wf-participation .wf-cov tr.done td { color:var(--muted); }
  #wf-participation .wf-cov tr.current { background:#FFF3DC; }
  .wf-dec { padding:2px 12px; margin-right:4px; }
  .wf-log { margin-top:10px; }
  .wf-log-title { font-size:13px; margin:6px 0 2px; }
  .wf-log-row { border-top:1px solid var(--line); padding:6px 0; font-size:12px; }
  .wf-log-row .wf-who { color:var(--muted); font-size:11px; }
  .wf-log-row .wf-sub { color:var(--fg); background:var(--panel2); border:1px solid var(--line-strong);
                        border-radius:5px; padding:0 6px; margin-left:5px; }
  .wf-log-row pre { margin:2px 0 0; white-space:pre-wrap; word-break:break-word; font-family:inherit; }

  #tab-chat.active { overflow:hidden; gap:8px; }
  #chat-model-badge { display:inline-block; font-size:11px; color:var(--muted);
                       border:1px solid var(--line-strong); border-radius:6px; padding:2px 8px;
                       font-family:var(--mono); }
  #chat-model-badge:empty { display:none; }
  #ch-log { flex:1 1 auto; min-height:0; overflow:auto; border:1px solid var(--line);
            background:var(--panel); border-radius:10px; padding:10px; }
  .ch-row { margin:8px 0; max-width:78%; }
  .ch-row.mine { margin-left:auto; text-align:right; }
  .ch-row .ch-who { color:var(--muted); font-size:11px; margin-bottom:2px; }
  .ch-row pre { margin:0; white-space:pre-wrap; word-break:break-word; font-family:inherit;
                font-size:13px; background:var(--panel2); border:1px solid var(--line-strong);
                border-radius:8px; padding:8px 10px; text-align:left; }
  .ch-row.agent pre { border-color:var(--accent-color); }
  .ch-row.failed pre { border-color:var(--red); color:var(--muted); }
  #ch-form { display:flex; gap:8px; align-items:flex-end; }
  #ch-input { flex:1 1 auto; padding:8px; font-size:13px; resize:vertical; }
  #ch-form button { padding:8px 14px; }

  .nt-row { border-bottom:1px solid var(--line); padding:8px 0; }
  .nt-row.read { opacity:.5; }
  .nt-head { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .nt-head .nt-read { margin-left:auto; padding:1px 8px; font-size:11px; }
  .nt-row pre { margin:3px 0 0; white-space:pre-wrap; word-break:break-word;
                font-family:inherit; font-size:13px; }
  .nt-kind { border-radius:6px; padding:1px 7px; font-size:11px; border:1px solid; }
  .nt-kind.approval { color:#92400E; border-color:#E8C580; background:#FFF3DC; }
  .nt-kind.risk     { color:#B91C1C; border-color:#F1B0B0; background:#FDECEC; }
  .nt-kind.handoff  { color:#1D4ED8; border-color:#93B4E8; background:#EAF1FE; }
  .nt-kind.note     { color:var(--muted); border-color:var(--line-strong); background:var(--panel2); }

  #tab-knowledge.active { overflow:auto; gap:8px; }
  #kn-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #kn-controls button:disabled { opacity:.55; cursor:progress; }
  .kn-hit { background:var(--panel); border:1px solid var(--line); border-radius:10px;
            padding:10px; margin:8px 0; cursor:pointer; transition:border-color .2s, box-shadow .2s; }
  .kn-hit:hover { border-color:#93B4E8; box-shadow:0 3px 10px rgba(30,64,175,.1); }
  .kn-open { font-size:11px; color:var(--muted); float:right; }
  .kn-head { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .kn-head b { color:var(--fg); }
  .kn-snip { font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .kn-snip mark { background:#FFE1A8; color:#5F3B04; border-radius:3px; padding:0 2px; }
  .kn-mode { font-size:11px; border-radius:6px; padding:1px 7px; margin-left:6px;
             border:1px solid var(--line-strong); cursor:help; font-family:var(--mono); }
  .kn-mode.on { border-color:#E8C580; color:#92400E; }
  .kn-mode.off { color:var(--muted); }
  .kn-mode-text { font-size:11px; color:var(--muted); margin-left:6px; font-family:var(--mono); }

  #tab-designer.active { overflow:hidden; gap:8px; }
  #dg-head { font-size:13px; color:var(--muted); }
  #dg-head span { color:var(--fg); }
  #dg-wrap { flex:1 1 auto; min-height:0; display:flex; gap:12px; }
  #dg-list { width:270px; flex:0 0 auto; overflow:auto; }
  #dg-pane { flex:1 1 auto; min-width:0; overflow:auto; }
  .dg-bucket { margin-bottom:18px; }
  .dg-bucket h4 { margin:0 0 8px; padding-bottom:5px; font-size:14px; color:var(--fg);
                  border-bottom:1px solid var(--line-strong); display:flex; gap:7px;
                  align-items:center; }
  .dg-bucket h4 span { font-size:11px; color:#fff; background:var(--muted);
                       border-radius:5px; padding:0 6px; font-weight:normal; font-family:var(--mono); }
  .dg-bucket .wf-empty { margin:0 0 0 4px; font-size:12px; opacity:.65; }
  .dg-item { border:1px solid var(--line); border-radius:8px; background:var(--panel);
             padding:8px; margin-bottom:6px; cursor:pointer; transition:border-color .2s; }
  .dg-item:hover, .dg-item.on { border-color:#93B4E8; }
  .dg-item-head { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .dg-item-sub { display:flex; justify-content:space-between; align-items:center;
                 margin-top:6px; font-size:11px; color:var(--muted); }
  .dg-day { font-size:11px; border-radius:6px; padding:1px 6px; border:1px solid var(--line-strong);
            font-family:var(--mono); }
  .dg-day.urgent { border-color:#F1B0B0; color:#B91C1C; }
  .dg-day.soon { border-color:#E8C580; color:#92400E; }
  .dg-day.normal { border-color:#93B4E8; color:#1D4ED8; }
  .dg-day.later, .dg-day.unknown { color:var(--muted); }
  .dg-tag { font-size:11px; border-radius:6px; padding:1px 6px; border:1px solid var(--line-strong);
            color:var(--muted); }
  .dg-tag.work { border-color:#E8C580; color:#92400E; }
  .dg-tag.sent { border-color:#93B4E8; color:#1D4ED8; }
  .dg-tag.ok { border-color:#E8C580; color:#8A5606; }
  .dg-pkg-head { margin-bottom:8px; }
  .dg-pptx { font-size:11px; color:var(--muted); }
  .dg-card { border:1px solid var(--line); border-radius:8px; background:var(--panel);
             padding:10px; margin-bottom:8px; }

  .more-table thead tr { text-align:left; color:var(--muted); }
  .more-table th { padding:6px; border-bottom:1px solid var(--line-strong); }

                  font-size:13px; line-height:1.6; }
  #doc-body mark { background:#FFE1A8; color:#5F3B04; border-radius:3px; padding:0 2px; }

  @media (max-width: 880px) {

<script>
  // promax(라이트) 변형 전용 패치 — app.js init 전에 실행된다.
  // ① 지도 팔레트를 라이트 배경용 계열로 ② 티커·범례 글자의 "흰색 쪽" 믹스를
  //    "네이비 쪽" 믹스로 교체(라이트 배경에서는 밝힌 색이 씻겨 안 보인다).
  (function () {
    if (!window.render || !window.logic) return;
    var render = window.render, logic = window.logic;
    Object.assign(render.DEFAULT_THEME, {
      red:'#DC2626', orange:'#D97706', yellow:'#CA8A04', blue:'#2563EB', gray:'#94A3B8',
      accent:'#D97706',
    });
    var MIX = '#1C2B55';  // 글자용 어둡힘 목표색(본문 네이비)
    render.drawTicker = function () {
      var all = render.allInstitutions().filter(function (r){ return render.state.activeRegions.has(r.region); });
      var top = logic.dedupeByInstitution(logic.sortByUrgency(all, render.state.today)).slice(0, 5);
      var el = document.getElementById('ticker'); if (!el) return;
      el.innerHTML = '<span class="tk-cap">임박 TOP5</span>' + top.map(function (r) {
        var band = logic.urgencyOf(r, render.state.today);
        var c = render._safeColor(render.URGENCY_COLORS[band], render.DEFAULT_THEME[band]);
        var mark = band === 'red' ? '▲ ' : '';
        return '<span style="color:color-mix(in srgb, ' + c + ' 78%, ' + MIX + ')">' + mark +
          logic.esc(r.name) + ' ' + logic.esc(logic.formatDDay(r, render.state.today)) + '</span>';
      }).join('<span class="tk-sep">·</span>');
    };
    render.drawLegend = function () {
      if (typeof document === 'undefined') return;
      var el = document.getElementById('legend'); if (!el) return;
      var rows = render.LEGEND_ITEMS.map(function (it) {
        var c = render._safeColor(render.URGENCY_COLORS[it[0]], render.DEFAULT_THEME[it[0]]);
        var warn = it[0] === 'gray' ? ' ' + render.ICONS.warn : '';
        return '<span class="lg-item" style="color:color-mix(in srgb, ' + c + ' 80%, ' + MIX + ')">' +
          '<i class="lg-sw" style="background:' + c + '"></i>' + logic.esc(it[1]) + warn + '</span>';
      });
      rows.push('<span class="lg-item"><i class="lg-sw lg-hatch" style="background:' +
        render._safeColor(render.INACTIVE_FILL, '#c3cad9') + '"></i>준비중</span>');
      el.innerHTML = '<div class="lg-title">입찰 임박도</div>' + rows.join('');
    };
    render.drawLegend();  // render.js 로드 시점에 이미 한 번 그렸으므로 새 규칙로 다시
  })();
</script>
<script src="js/app.js"></script>
<script>
  // 탭 전환 (와이어링은 app.js가 보강; 여기선 기본 토글 보장)
  document.querySelectorAll('.tab-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (x){ x.classList.remove('active'); });
      document.querySelectorAll('.tab-view').forEach(function (x){ x.classList.remove('active'); });
      b.classList.add('active');
      document.getElementById('tab-' + b.dataset.tab).classList.add('active');
      if (window.app && window.app.onTabChange) window.app.onTabChange(b.dataset.tab);
    });
  });
</script>
</body>
</html>
