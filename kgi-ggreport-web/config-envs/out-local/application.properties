# ── 외부망 로컬 (out-local) — MySQL ─────────────────────────────────────────
# 5축 중 유일하게 Oracle이 아닌 축이다(설계 상단 2026-08-26 개정 표).
# ⚠️ 여기서 통과했다고 Oracle 정합성이 증명되지 않는다 — §5의 빈 문자열→NULL,
#    CLOB 정렬 제약이 MySQL에서는 드러나지 않는다. H2를 금지한 것과 같은 이유다.
#    로직·REST 계약을 빨리 돌려 보는 자리이지 DB 계층의 합격 판정 자리가 아니다.

server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.jndi-name=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ggreportdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# 관리자(root)가 아니라 이 DB 전용 계정을 쓴다 — 설정 파일이 유출돼도 피해 범위가
# 이 DB 하나로 제한된다. 계정 생성은 README 참조.
spring.datasource.username=ggreport
spring.datasource.password=<OUT-LOCAL-DB-PASSWORD>

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kbstar.kgi.ggreport.web.domain
mybatis.configuration.map-underscore-to-camel-case=true

# 산출물·아카이브 루트 (Python의 data/report_archive 대응)
ggreport.output-root=C:/ggreport-out-local

logging.level.com.kbstar.kgi.ggreport=DEBUG
