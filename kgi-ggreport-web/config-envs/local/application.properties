# ── 내부망 로컬 (local) — Oracle ────────────────────────────────────────────
# 내부망은 로컬부터 이미 Oracle이다(설계 상단 2026-08-26 개정 표).
# Mapper·DDL 정합성과 Oracle Text는 이 축부터 유효하다.

server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.jndi-name=
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCL
spring.datasource.username=<LOCAL-DB-USER>
spring.datasource.password=<LOCAL-DB-PASSWORD>

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kbstar.kgi.ggreport.web.domain
mybatis.configuration.map-underscore-to-camel-case=true

ggreport.output-root=C:/ggreport-local

logging.level.com.kbstar.kgi.ggreport=DEBUG
# 기관장 매퍼는 INFO — DEBUG 면 SQL 파라미터(기관장 이름·칸 값 원문)가 로그에 남는다.
logging.level.com.kbstar.kgi.ggreport.web.mapper.InstitutionHeadMapper=INFO
# 수집 요청 매퍼도 INFO — DEBUG 면 SQL 파라미터(요청자 사번·제외/실패 사유 원문)가 로그에 남는다(security 11-17).
logging.level.com.kbstar.kgi.ggreport.web.mapper.PlanCollectMapper=INFO

# 업로드 한도 — 명시하지 않으면 Spring 기본(파일 1MB)이 TaskFiles 의 50MB 한도보다 먼저 막는다.
# 파일은 TaskFiles.MAX_BYTES(50MB)와 같게, 요청은 폼 필드 여유로 55MB.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# 개발축: 예기치 못한 500 의 원문 예외를 응답에 싣는다(운영 prod/stg 는 false).
ggreport.errors.detail=true

# 이사회 자료 작성(엑셀 업로드) — 5MB 확정(2026-11-02). 압축 해제 상한: 시트 XML 1개 20MB·합계 40MB. 동시 2건.
ggreport.board-write.max-mb=5
ggreport.board-write.max-unpacked-entry-mb=20
ggreport.board-write.max-unpacked-total-mb=40
ggreport.board-write.concurrency=2

# 기관장 정보(NEXT 72·77, 026) — 스위치 기본 켬(사용자 결정). 026 DDL 을 먼저 적용한 DB 에서만 켠다. 사진 폴더는 DB 와 함께 백업 대상.
ggreport.inst-head.enabled=true
ggreport.inst-head.photo-dir=data/head-photo
ggreport.inst-head.photo-retention-days=-1

# 사업계획 수집 agent 직접 호출 — 내부망에서는 외부 호출이 차단되므로 키를 비워 둔다(= [수집 실행] 503, 내려받기로 진행).
plan-agent.url=
plan-agent.allowed-host=
plan-agent.token=
plan-agent.allow-http-localhost=false

# 사업계획 서버 폴더 반입(NEXT 56, SCHEMA ⑪) — 비면 꺼짐(GET/POST /plan-collect/inbox* 503 PLAN_INBOX_OFF, 파일 올리기 API 는 그대로).
# 값은 uploader '사업계획 CSV' 전용 폴더와 같은 경로를 config/application.properties(git 미추적)에만 넣는다.
# 켜기 전 조건: 폴더 쓰기 = uploader 서비스 계정만·웹 계정은 읽기만, uploader 같은 이름 거부, 업로드 SHA-256·올린 사람 기록(security S2·S4).
ggreport.plan-inbox.location=
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
