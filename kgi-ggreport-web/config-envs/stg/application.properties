# ── 내부망 스테이징 (stg) — Oracle ──────────────────────────────────────────

server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.jndi-name=
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//<STG-DB-HOST>:1521/<STG-DB-SERVICE>
spring.datasource.username=<STG-DB-USER>
spring.datasource.password=<STG-DB-PASSWORD>

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kbstar.kgi.ggreport.web.domain
mybatis.configuration.map-underscore-to-camel-case=true

ggreport.output-root=/app/ggreport

logging.level.com.kbstar.kgi.ggreport=INFO

# 업로드 한도 — 명시하지 않으면 Spring 기본(파일 1MB)이 TaskFiles 의 50MB 한도보다 먼저 막는다.
# 파일은 TaskFiles.MAX_BYTES(50MB)와 같게, 요청은 폼 필드 여유로 55MB.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# 예기치 못한 500 의 상세 문구는 응답에 싣지 않는다(서버 로그에만). 개발축만 true.
ggreport.errors.detail=false

# 이사회 자료 작성(엑셀 업로드) — 5MB 확정(2026-11-02). 압축 해제 상한: 시트 XML 1개 20MB·합계 40MB. 동시 2건.
ggreport.board-write.max-mb=5
ggreport.board-write.max-unpacked-entry-mb=20
ggreport.board-write.max-unpacked-total-mb=40
ggreport.board-write.concurrency=2
