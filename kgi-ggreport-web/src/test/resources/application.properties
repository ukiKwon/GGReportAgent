# 테스트 클래스패스에만 있고 WAR 에는 들어가지 않는다.
#
# ⚠️ 이름을 `application-test.properties` 로 두지 않는다. 그건 Spring 프로파일
#    파일이라 `test` 프로파일이 켜져야 읽히는데, 켜는 것을 잊으면 조용히 무시되고
#    테스트가 개발용 DB 를 잡는다. uploader 에서 실제로 그 상태였다
#    (uploader/README §13-②, 2026-08-26 개명으로 해소).
#
# ⚠️ 여기의 H2 는 컨트롤러/서비스 계층을 돌려 보기 위한 것일 뿐이다.
#    Oracle 의존 테스트를 H2 로 대체하지 않는다(설계 §8) — §5의 빈 문자열→NULL,
#    CLOB 정렬 제약이 H2 에서는 드러나지 않는다. Mapper·DDL 정합성은 내부망
#    Oracle 에서만 판정한다.

# jndi-name 이 빈 값으로라도 존재하면 JndiDataSourceAutoConfiguration 이 "속성이
# 있다"고 보고 빈 이름으로 JNDI 조회를 시도한다. 비-prod 설정 4개와 같은 이유로 끈다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.jndi-name=
spring.datasource.url=jdbc:h2:mem:kgi-ggreport-test;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kbstar.kgi.ggreport.web.domain
mybatis.configuration.map-underscore-to-camel-case=true

# 스키마는 **Oracle 정본 DDL 을 그대로** 돌린다. 테스트 전용 스크립트를 따로 두면
# 정본이 바뀌었을 때 조용히 갈라진다(그러면 여기 통과가 아무 의미도 없어진다).
# ⚠️ 그래도 **H2 통과가 Oracle 합격은 아니다**(설계 §8) — 여기서 확인되는 것은
#    "컨트롤러·서비스가 이 스키마 위에서 돈다"까지다.
# ⚠️ 001·002 는 멱등하지 않다. 테스트 컨텍스트가 **하나로 캐시되는 것을 전제**한다 —
#    새 테스트가 다른 프로퍼티로 별도 컨텍스트를 띄우면 DDL 이 두 번 돌아 실패한다.
#    그때는 스크립트가 아니라 그 테스트의 프로퍼티를 다시 볼 것.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/oracle/001_schema.sql,classpath:db/oracle/002_seq_no.sql,classpath:db/oracle/004_widen_iso_timestamps.sql
# 시드(003)도 **정본 그대로** 돌린다. 이건 001·002 와 달리 멱등하다(MERGE).
spring.sql.init.data-locations=classpath:db/oracle/003_seed_institutions.sql
# ⚠️ 기본값이 플랫폼 인코딩이라 Windows(cp949)에서 003 의 한글이 깨진다. 그러면
#    골든 00·01 이 이름만 다르게 실패하고, 원인이 SQL 이 아니라 인코딩이라 찾기 어렵다.
spring.sql.init.encoding=UTF-8

ggreport.output-root=${java.io.tmpdir}/kgi-ggreport-test
# ⚠️ 상대경로이므로 **작업 디렉터리가 kgi-ggreport-web/ 이어야 한다** (Maven 은
#    항상 그렇다. IDE 는 실행 구성의 작업 디렉터리를 모듈로 맞출 것 —
#    config-envs/out-local 의 static-locations 와 같은 전제다).
#    골든 06(원문 열람)이 리포의 실제 코퍼스 파일을 읽는다.
ggreport.corpus-root=../corpus
ggreport.archive-root=${java.io.tmpdir}/kgi-ggreport-test-archive
