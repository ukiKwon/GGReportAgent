# 테스트 클래스패스에만 있고 WAR 에는 들어가지 않는다.
#
# ⚠️ 이름을 `application-test.properties` 로 두지 않는다. 그건 Spring 프로파일
#    파일이라 `test` 프로파일이 켜져야 읽히는데, 켜는 것을 잊으면 조용히 무시되고
#    테스트가 개발용 DB 를 잡는다. uploader 에서 실제로 그 상태였다
#    (uploader/README §13-②, 2026-08-26 개명으로 해소).
#
# ⚠️ 여기의 H2 는 컨트롤러/서비스 계층을 돌려 보기 위한 것일 뿐이다.
#    Oracle 의존 테스트를 H2 로 대체하지 않는다(설계 §8) — §5의 빈 문자열→NULL,
#    CLOB 정렬 제약이 H2 에서는 드러나지 않는다. Mapper·DDL 정합성은 내부망
#    Oracle 에서만 판정한다.

# jndi-name 이 빈 값으로라도 존재하면 JndiDataSourceAutoConfiguration 이 "속성이
# 있다"고 보고 빈 이름으로 JNDI 조회를 시도한다. 비-prod 설정 4개와 같은 이유로 끈다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.jndi-name=
spring.datasource.url=jdbc:h2:mem:kgi-ggreport-test;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kbstar.kgi.ggreport.web.domain
mybatis.configuration.map-underscore-to-camel-case=true

ggreport.output-root=${java.io.tmpdir}/kgi-ggreport-test
