<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 대시보드</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🏟️ 에이전트 대시보드</h1>
  <span id="conn" class="conn">○ 데모 모드</span>
  <div class="tools">
    <label>화면 속도
      <select id="speed">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
      </select>
    </label>
    <button id="full" type="button">⛶ 전체화면</button>
    <button id="sound" type="button">🔇 소리 켜기</button>
  </div>
</header>
<div id="now" aria-live="polite">지금 작업 중인 에이전트: 없음</div>
<main>
  <div class="stage"><canvas id="c" role="img" aria-label="에이전트 작업 현황 트랙. 각 에이전트가 선수로 달리며 바퀴 수가 작업량을 나타냅니다" width="1280" height="800"></canvas><div id="toasts"></div></div>
  <section id="chips" aria-label="에이전트 작업 상태"></section>
  <details class="dev">
    <summary>시험 도구 (평소엔 쓰지 않음 — 에이전트는 작업에 따라 자동으로 움직입니다)</summary>
    <div class="devrow">
      <button id="allOn" type="button">전원 시작(시험)</button>
      <button id="allOff" type="button">전원 멈춤(시험)</button>
      <button id="reset" type="button">바퀴 초기화</button>
      <span id="devchips"></span>
    </div>
  </details>
</main>
<script src="fmt.js"></script>
<script src="app.js"></script>
</body>
</html>
