function init() {
	var f = document.form;
	var ck = 'gov.mogaha.ntis.cmm.util.Page@2e939e75';
	if(ck=="null"){
		srchList();
	}

}
//-------------------------------------------------------------------
// 설명   : 고시공고 목록 조회
//-------------------------------------------------------------------	
function search(){
	var f = document.form;
	var str = f.not_ancmt_sj.value;

	if(str != null && str != ''){
		var len = str.length;
		if(len > 0 ){
			for(var i=0;i<len;i++){
				if(isEtcChar(str.charAt(i))){
					alert('특수문자 입력할 수 없습니다');
					f.not_ancmt_sj.focus();
					return;
				}
			}
		}
	}

	f.target = "_self";
	f.action = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do";	
	f.method.value   = 'selectListOfrNotAncmt'; //Action
	f.methodnm.value = 'selectListOfrNotAncmtHomepage';
	f.submit();	
}			
//-------------------------------------------------------------------
// 설명   : 검색버튼 클릭시 페이지정보 초기화 하고 조회
//-------------------------------------------------------------------	
function srchList(){
	document.form.pageIndex.value=""; //페이지 인덱스 초기화
	search();
}
//-------------------------------------------------------------------
// 설명   : 페이지 이동시 조회
//-------------------------------------------------------------------
function goPage() {
	search();
}
//-------------------------------------------------------------------
// 설명   : 고시공고 상세내용 조회
//-------------------------------------------------------------------		
function searchDetail(not_ancmt_mgt_no) {
	var f = document.form;
	f.not_ancmt_mgt_no.value = not_ancmt_mgt_no ;
	f.target = "_self";
	f.action = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do";	
	f.method.value   = 'selectOfrNotAncmt'; //Action
	f.methodnm.value = 'selectOfrNotAncmtRegst';
	f.submit();		    

}
//-------------------------------------------------------------------
// 설명   : 엔터 눌렀을 때, 검색버튼 클릭시와 같은 기능 
//-------------------------------------------------------------------	
function enterKey(){
	var key = event.keyCode; 
	if( key == 13 ){ 
		srchList();
	}
}  
//-------------------------------------------------------------------
// 설명   : 고시공고 예전 자료 보기 조회
//-------------------------------------------------------------------	
function changeDetail() {
	var url = "http://bukgu.gwangju.kr/phps/board/board_srh.php?b_code=LAW_NOTICE";
	window.open(url,"viewDetail","toolbar=no,location=no,diretories=no,status=no,menubar=no,scrollbars=yes,resizable=no,width=700,height=670");		
}
