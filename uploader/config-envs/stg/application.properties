server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.jndi-name=
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//<STG-DB-HOST>:1521/<STG-DB-SERVICE>
spring.datasource.username=<STG-DB-USER>
spring.datasource.password=<STG-DB-PASSWORD>

upload.base-dir=/app/uploader

reclassification.cron=0 */5 * * * *
