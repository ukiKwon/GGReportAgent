server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.jndi-name=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/uploaderdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# 관리자(root)가 아니라 uploaderdb 전용 계정을 쓴다 — 설정 파일이 유출돼도
# 피해 범위가 이 DB 하나로 제한된다. 계정 생성은 README §9 참조.
spring.datasource.username=uploader
spring.datasource.password=<OUT-LOCAL-DB-PASSWORD>

upload.base-dir=C:/uploader-out-local

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kb.uploader.domain
mybatis.configuration.map-underscore-to-camel-case=true

reclassification.cron=0 */5 * * * *

logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
