server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.jndi-name=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/uploaderdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# 관리자(root)가 아니라 uploaderdb 전용 계정을 쓴다 — 설정 파일이 유출돼도
# 피해 범위가 이 DB 하나로 제한된다. 계정 생성은 README §9 참조.
spring.datasource.username=uploader
spring.datasource.password=<OUT-LOCAL-DB-PASSWORD>

upload.base-dir=C:/uploader-out-local

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kb.uploader.domain
mybatis.configuration.map-underscore-to-camel-case=true

# (2026-09-23 배치 폐지) reclassification.cron=0 */5 * * * *

logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# ---- 2026-09-23 파싱 전환: 원본 보관 / 산출물 경로 ----
# .properties 는 ISO-8859-1 로 읽히므로 한글 경로는 \uXXXX 로 적는다.
#   \uc6d0\ubcf8/... = 원본/전처리/입찰제안서_PPT
#   \uc804\ucc98\ub9ac/RFP/... = 전처리/RFP/파싱후
upload.userdata-dir=${upload.base-dir}/userdata
upload.proposal-json-dir=${upload.base-dir}/\uc6d0\ubcf8/\uc804\ucc98\ub9ac/\uc785\ucc30\uc81c\uc548\uc11c_PPT
upload.rfp-md-dir=${upload.base-dir}/\uc804\ucc98\ub9ac/RFP/\ud30c\uc2f1\ud6c4

# 한글 폼값·파일명 인코딩 고정
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8

# 업로드 크기 (기본값은 1MB/10MB 라 실무 문서가 바로 걸린다)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
