<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, pageTitle, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">파일 업로드 관리 시스템</title>
  <style>
    /* ── taste-v1 · KB 기업 스타일 ──────────────────────────────── */
    :root {
      --kb-gold:        #FFB500;
      --kb-gold-deep:   #E6A300;
      --kb-navy:        #1B2A6B;
      --kb-navy-deep:   #0F1C4D;
      --kb-navy-mid:    #243680;
      --bg:             #F2F4FA;
      --surface:        #FFFFFF;
      --border:         #DDE3F0;
      --border-strong:  #B8C2DC;
      --text-1:         #0F1C4D;
      --text-2:         #4A5580;
      --text-3:         #8994B8;
      --green:          #0D9488;
      --green-bg:       #F0FDFA;
      --red:            #DC2626;
      --red-bg:         #FEF2F2;
      --amber:          #D97706;
      --amber-bg:       #FFFBEB;
      --r-sm:           5px;
      --r-md:           8px;
      --r-lg:           12px;
      --sidebar-w:      228px;
      --shadow-card:    0 1px 2px rgba(15,28,77,.06), 0 2px 6px rgba(15,28,77,.06);
      --shadow-high:    0 4px 16px rgba(15,28,77,.12);
      --font: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
      'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif;
      --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --kb-navy:     #0F1C4D;
        --kb-navy-deep:#070F2E;
        --bg:          #131929;
        --surface:     #1C2540;
        --border:      #2C3A65;
        --border-strong:#3A4D82;
        --text-1:      #EDF0FC;
        --text-2:      #99A8CC;
        --text-3:      #5C6F9C;
        --green-bg:    rgba(13,148,136,.12);
        --red-bg:      rgba(220,38,38,.12);
        --amber-bg:    rgba(217,119,6,.12);
        --shadow-card: 0 1px 2px rgba(0,0,0,.4);
        --shadow-high: 0 4px 16px rgba(0,0,0,.4);
      }
    }
    :root[data-theme="dark"] {
      --kb-navy:     #0F1C4D;
      --kb-navy-deep:#070F2E;
      --bg:          #131929;
      --surface:     #1C2540;
      --border:      #2C3A65;
      --border-strong:#3A4D82;
      --text-1:      #EDF0FC;
      --text-2:      #99A8CC;
      --text-3:      #5C6F9C;
      --green-bg:    rgba(13,148,136,.12);
      --red-bg:      rgba(220,38,38,.12);
      --amber-bg:    rgba(217,119,6,.12);
      --shadow-card: 0 1px 2px rgba(0,0,0,.4);
      --shadow-high: 0 4px 16px rgba(0,0,0,.4);
    }
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.55;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
    }
    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--kb-navy);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      left: 0; top: 0; bottom: 0;
      z-index: 100;
    }
    .gold-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--kb-gold), var(--kb-gold-deep));
    }
    .sidebar-logo {
      padding: 20px 20px 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark {
      width: 32px; height: 32px;
      background: var(--kb-gold);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800;
      color: var(--kb-navy-deep);
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
    .logo-brand { font-size: 12px; font-weight: 700; color: #fff; letter-spacing: .5px; }
    .logo-sub   { font-size: 10px; color: rgba(255,255,255,.45); }
    .sidebar-nav { padding: 12px 10px; flex: 1; }
    .nav-label {
      font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,.3);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 10px 10px 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 10px;
      border-radius: var(--r-md);
      color: rgba(255,255,255,.6);
      font-size: 13.5px; font-weight: 500;
      text-decoration: none;
      transition: background 150ms, color 150ms;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.9); }
    .nav-item.active { background: rgba(255,181,0,.15); color: var(--kb-gold); }
    .nav-item.active::before {
      content: '';
      position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 20px;
      background: var(--kb-gold);
      border-radius: 0 2px 2px 0;
    }
    .nav-icon { width: 16px; height: 16px; opacity: .9; flex-shrink: 0; }
    .nav-badge {
      margin-left: auto;
      background: var(--red);
      color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
    }
    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 11px;
      color: rgba(255,255,255,.3);
    }
    /* ── Main ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 24px; gap: 16px;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text-1); flex: 1; }
    .topbar-divider { width: 1px; height: 20px; background: var(--border); }
    .topbar-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); font-weight: 500; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--kb-navy); color: var(--kb-gold);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .content { padding: 24px; flex: 1; }
    /* ── KPI ── */
    .kpi-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 24px; }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-card);
      display: flex; align-items: flex-start; gap: 14px;
      transition: box-shadow 200ms;
    }
    .kpi-card:hover { box-shadow: var(--shadow-high); }
    .kpi-icon {
      width: 40px; height: 40px;
      border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .kpi-icon.total   { background: rgba(27,42,107,.08); }
    .kpi-icon.done    { background: var(--green-bg); }
    .kpi-icon.pending { background: var(--red-bg); }
    .kpi-body { min-width: 0; }
    .kpi-label { font-size: 11.5px; font-weight: 500; color: var(--text-3); letter-spacing: .2px; margin-bottom: 4px; }
    .kpi-value { font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--text-1); }
    .kpi-value.danger  { color: var(--red); }
    .kpi-value.success { color: var(--green); }
    .kpi-sub { font-size: 11px; color: var(--text-3); margin-top: 3px; }
    /* ── Section header ── */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .section-title   { font-size: 14px; font-weight: 600; color: var(--text-1); }
    .section-sub     { font-size: 12px; color: var(--text-3); margin-left: 6px; }
    /* ── Search bar ── */
    .search-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
      display: flex; gap: 10px;
    }
    .search-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 8px 12px;
      font-size: 13.5px; font-family: var(--font);
      color: var(--text-1); background: var(--bg);
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus { border-color: var(--kb-navy); box-shadow: 0 0 0 3px rgba(27,42,107,.12); }
    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px;
      border-radius: var(--r-md);
      font-size: 13px; font-weight: 600;
      border: none; cursor: pointer;
      font-family: var(--font);
      text-decoration: none;
      transition: background 150ms, transform 80ms;
      white-space: nowrap;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--kb-navy); color: #fff; }
    .btn-primary:hover { background: var(--kb-navy-mid); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-outline { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--border-strong); color: var(--text-1); background: var(--bg); }
    .btn-danger-outline { background: transparent; color: var(--red); border: 1px solid rgba(220,38,38,.35); }
    .btn-danger-outline:hover { background: var(--red-bg); border-color: var(--red); }
    /* ── Table ── */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      font-size: 11.5px; font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase; letter-spacing: .7px;
      padding: 10px 16px; text-align: left;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px; color: var(--text-1);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(27,42,107,.025); }
    .file-name { font-weight: 500; }
    .file-ext {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      padding: 1px 5px; border-radius: 3px;
      margin-right: 5px; vertical-align: middle;
      font-family: var(--mono); text-transform: uppercase;
      background: var(--border); color: var(--text-2);
    }
    .ext-pdf { background: #FEE2E2; color: #B91C1C; }
    .ext-hwp { background: #DBEAFE; color: #1D4ED8; }
    .ext-md  { background: #F3E8FF; color: #7C3AED; }
    .badge {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 99px;
    }
    .badge-done    { background: var(--green-bg); color: var(--green); }
    .badge-pending { background: var(--red-bg);   color: var(--red);   }
    .category-chip {
      display: inline-block; font-size: 11px; font-weight: 500;
      padding: 2px 8px; border: 1px solid var(--border-strong);
      border-radius: 4px; color: var(--text-2);
    }
    .time-col { font-variant-numeric: tabular-nums; color: var(--text-3); font-size: 12.5px; }
    /* ── Banners ── */
    .alert-banner {
      display: flex; align-items: center; gap: 10px;
      background: var(--amber-bg);
      border: 1px solid rgba(217,119,6,.25);
      border-top: 2px solid var(--amber);
      border-radius: var(--r-md);
      padding: 10px 14px; margin-bottom: 16px;
      font-size: 13px; color: var(--amber);
    }
    .alert-success {
      display: flex; align-items: center; gap: 10px;
      background: var(--green-bg);
      border: 1px solid rgba(13,148,136,.25);
      border-top: 2px solid var(--green);
      border-radius: var(--r-md);
      padding: 10px 14px; margin-bottom: 16px;
      font-size: 13px; color: var(--green);
    }
    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px; font-weight: 600; color: var(--text-1);
      background: var(--bg);
    }
    .card-body { padding: 20px; }
    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
    .form-control {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 8px 12px;
      font-size: 13.5px; font-family: var(--font);
      color: var(--text-1); background: var(--bg);
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
    }
    .form-control::placeholder { color: var(--text-3); }
    .form-control:focus { border-color: var(--kb-navy); box-shadow: 0 0 0 3px rgba(27,42,107,.12); }
    select.form-control { cursor: pointer; }
    .form-control-sm { padding: 5px 10px; font-size: 12.5px; }
    /* ── Pagination ── */
    .pagination { display: flex; gap: 4px; padding: 16px; justify-content: center; flex-wrap: wrap; }
    .page-item a {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      font-size: 13px; color: var(--text-2);
      text-decoration: none;
      transition: all 150ms;
    }
    .page-item a:hover { border-color: var(--kb-navy); color: var(--kb-navy); }
    .page-item.active a { background: var(--kb-navy); border-color: var(--kb-navy); color: #fff; }
    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 48px 24px; color: var(--text-3); }
    .empty-state svg { margin-bottom: 12px; opacity: .4; }
    .empty-state-text { font-size: 14px; }
    /* ── Toolbar ── */
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    /* ── Inline form ── */
    .form-inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    /* ── SVG icon ── */
    .icon { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  /* ── agent 테스트 패널 ── */
.agent-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100vw;
  background: var(--surface); border-left: 1px solid var(--border);
  box-shadow: var(--shadow-high); transform: translateX(100%);
  transition: transform .18s ease; z-index: 120; display: flex; flex-direction: column;
}
.agent-panel.open { transform: translateX(0); }
.agent-panel-head {
  display: flex; align-items: center; gap: 8px; padding: 14px 16px;
  border-bottom: 1px solid var(--border); background: var(--kb-navy); color: #fff;
}
.agent-panel-head .title { font-size: 14px; font-weight: 600; flex: 1; }
.agent-close {
  background: transparent; border: 0; color: inherit; cursor: pointer;
  font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: var(--r-sm);
}
.agent-close:hover { background: rgba(255,255,255,.15); }
.agent-panel-body { padding: 16px; overflow-y: auto; flex: 1; }
.agent-section-title { font-size: 12px; font-weight: 700; color: var(--text-3); letter-spacing: .04em; margin: 0 0 8px; text-transform: uppercase; }
.agent-api-item {
  border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px;
  cursor: pointer; margin-bottom: 8px; background: var(--bg);
}
.agent-api-item.selected { border-color: var(--kb-navy); background: var(--surface); box-shadow: 0 0 0 2px rgba(27,42,107,.1); }
.agent-api-item .name { font-size: 13px; font-weight: 600; color: var(--text-1); }
.agent-api-item .path { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); margin-top: 2px; word-break: break-all; }
.agent-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.agent-field label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.agent-url {
  font-family: var(--mono); font-size: 11.5px; color: var(--text-2);
  background: var(--bg); border: 1px dashed var(--border); border-radius: var(--r-sm);
  padding: 6px 8px; word-break: break-all; margin: 8px 0 12px;
}
.agent-status { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12px; }
.agent-pill { display: inline-flex; padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 11.5px; }
.agent-pill.ok { background: var(--green-bg); color: var(--green); }
.agent-pill.err { background: var(--red-bg); color: var(--red); }
.agent-json {
  font-family: var(--mono); font-size: 11.5px; white-space: pre; overflow: auto;
  max-height: 320px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 10px; color: var(--text-1);
}
/* ── 대화형 요청 로그 ── */
.agent-chat { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.agent-bubble {
  max-width: 88%; padding: 8px 11px; border-radius: 12px; font-size: 12.5px; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
}
.agent-bubble.me { align-self: flex-end; background: var(--kb-navy); color: #fff; border-bottom-right-radius: 4px; }
.agent-bubble.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); color: var(--text-1); border-bottom-left-radius: 4px; }
.agent-caret { display: inline-block; width: 6px; color: inherit; animation: agentCaret 1s steps(1) infinite; }
@keyframes agentCaret { 50% { opacity: 0; } }
.agent-dots { display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
.agent-dots i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); display: block;
  animation: agentDot 1.1s ease-in-out infinite;
}
.agent-dots i:nth-child(2) { animation-delay: .18s; }
.agent-dots i:nth-child(3) { animation-delay: .36s; }
@keyframes agentDot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) {
  .agent-caret, .agent-dots i { animation: none; }
}
.agent-result-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 12px; }
.agent-result-table th, .agent-result-table td { border-bottom: 1px solid var(--border); padding: 6px 4px; text-align: left; vertical-align: top; }
.agent-result-table th { color: var(--text-3); font-weight: 600; font-size: 11.5px; }
/* ── 크게보기 모달 ── */
.agent-overlay { position: fixed; inset: 0; background: rgba(15,28,77,.45); z-index: 130; display: none; }
.agent-overlay.open { display: block; }
.agent-modal {
  position: fixed; inset: 24px; z-index: 140; background: var(--surface);
  border-radius: var(--r-lg); box-shadow: var(--shadow-high); display: none;
  flex-direction: column; overflow: hidden;
}
.agent-modal.open { display: flex; }
.agent-modal-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.agent-modal-head .title { font-size: 15px; font-weight: 700; color: var(--text-1); flex: 1; }
.agent-modal-meta { font-size: 12px; color: var(--text-2); display: flex; gap: 10px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--bg); }
.agent-tabs { display: flex; gap: 4px; padding: 10px 18px 0; }
.agent-tab { border: 1px solid var(--border); border-bottom: 0; background: var(--bg); color: var(--text-2);
  padding: 6px 14px; border-radius: var(--r-sm) var(--r-sm) 0 0; cursor: pointer; font-size: 12.5px; }
.agent-tab.active { background: var(--surface); color: var(--text-1); font-weight: 600; }
.agent-modal-body { padding: 16px 18px; overflow-y: auto; flex: 1; border-top: 1px solid var(--border); }
.slide-card { border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 10px; background: var(--surface); }
.slide-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.slide-no { font-family: var(--mono); font-size: 11.5px; color: #fff; background: var(--kb-navy); border-radius: var(--r-sm); padding: 2px 7px; }
.slide-title { font-size: 13.5px; font-weight: 600; color: var(--text-1); flex: 1; }
.slide-text { font-size: 12.5px; color: var(--text-2); white-space: pre-wrap; line-height: 1.6; }
</style>
</head>
<body>

<!-- ── 사이드바 ── -->
<aside class="sidebar">
  <div class="gold-bar"></div>
  <div class="sidebar-logo">
    <div class="logo-mark">KB</div>
    <div class="logo-text">
      <span class="logo-brand">국민은행</span>
      <span class="logo-sub">파일 업로드 관리</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-label">메뉴</div>

    <a th:href="@{/}"
       th:class="${'nav-item' + (#request.getRequestURI() == '/' ? ' active' : '')}">
      <svg class="nav-icon icon" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      대시보드
    </a>

    <a th:href="@{/upload}"
       th:class="${'nav-item' + (#request.getRequestURI().startsWith('/upload') ? ' active' : '')}">
      <svg class="nav-icon icon" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      파일 업로드
    </a>

    <a th:href="@{/parse-status}"
       th:class="${'nav-item' + (#request.getRequestURI() == '/parse-status' ? ' active' : '')}">
      <svg class="nav-icon icon" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      파싱 현황
      <!-- 2026-09-23: 배지가 미분류 건수 → 파싱 실패 건수로 바뀜었다 -->
      <span th:if="${parseFailedCount != null and parseFailedCount > 0}"
            class="nav-badge" th:text="${parseFailedCount}"></span>
    </a>

    <a th:href="@{/file-status/classified}"
       th:class="${'nav-item' + (#request.getRequestURI().startsWith('/file-status/classified') ? ' active' : '')}">
      <svg class="nav-icon icon" viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      분류 재작업
    </a>

    <a th:href="@{/institutions}"
       th:class="${'nav-item' + (#request.getRequestURI().startsWith('/institutions') ? ' active' : '')}">
      <svg class="nav-icon icon" viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      기관 카테고리
    </a>
  </nav>

  <div class="sidebar-footer">KB Financial AI 2 Center · v1.0</div>
</aside>

<!-- ── Main ── -->
<main class="main">
  <header class="topbar">
    <span class="topbar-title" th:text="${pageTitle}">파일 업로드 관리</span>
    <div class="topbar-divider"></div>
    <button type="button" class="btn btn-outline btn-sm" id="agentTestOpen">
      <svg class="icon" viewBox="0 0 24 24" style="margin-right:4px">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      agent 테스트
    </button>
    <div class="topbar-user">
      <div class="avatar">관</div>
      관리자
    </div>
  </header>
  <div class="content">
    <div th:replace="${content}"></div>
  </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<!-- ── agent 테스트 패널 ── -->
<aside class="agent-panel" id="agentPanel" th:attr="data-base=@{/}">
  <div class="agent-panel-head">
    <span class="title">agent 테스트 — 제공 API 호출</span>
    <button type="button" class="agent-close" id="agentTestClose" aria-label="닫기">&times;</button>
  </div>
  <div class="agent-panel-body">
    <p class="agent-section-title">API 목록</p>
    <div id="agentApiList"></div>

    <p class="agent-section-title" style="margin-top:18px">파라미터</p>
    <div id="agentParams"></div>
    <div class="agent-url" id="agentUrl">—</div>
    <button type="button" class="btn btn-primary btn-sm" id="agentSend">요청</button>

    <div id="agentResult" style="margin-top:16px"></div>
  </div>
</aside>

<div class="agent-overlay" id="agentOverlay"></div>
<div class="agent-modal" id="agentModal">
  <div class="agent-modal-head">
    <span class="title" id="agentModalTitle">제안서</span>
    <button type="button" class="btn btn-outline btn-sm" id="agentModalClose">닫기</button>
  </div>
  <div class="agent-modal-meta" id="agentModalMeta"></div>
  <!-- 탭은 문서 종류(제안서/RFP)에 따라 agent-test.js 가 채운다 -->
  <div class="agent-tabs" id="agentModalTabs">
  </div>
  <div class="agent-modal-body" id="agentModalBody"></div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/agent-test.js}"></script>
</body>
</html>
