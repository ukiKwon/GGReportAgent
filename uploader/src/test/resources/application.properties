# 이 파일은 `mvn test` 클래스패스에만 있고 WAR에는 들어가지 않는다.
# 2026-08-26 개명 — 종전 이름 `application-test.properties`는 Spring 프로파일
# 파일이라 `test` 프로파일이 켜져야 읽히는데 켜는 곳이 아무 데도 없어서
# **한 번도 적용되지 않았다.** 프로파일 스위치 없이 항상 읽히는 이름으로 바꿨다.
# (`src/main/resources`에는 `application.properties`가 없으므로 덮어쓰는 것도 없다.)

# DataSource — H2 (테스트 전용)
# jndi-name을 빈 값으로 두면 JndiDataSourceAutoConfiguration이 "속성이 있다"고 보고
# 빈 이름으로 JNDI 조회를 시도한다. config-envs의 비-prod 설정 4개와 같은 이유로 끈다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.datasource.jndi-name=
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 스키마 초기화
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.sql.init.mode=always

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kb.uploader.domain
mybatis.configuration.map-underscore-to-camel-case=true

upload.base-dir=/tmp/uploader-test
# (2026-09-23 배치 폐지) reclassification.cron=0 */5 * * * *

# ---- 2026-09-23 파싱 전환: 원본 보관 / 산출물 경로 ----
# .properties 는 ISO-8859-1 로 읽히므로 한글 경로는 \uXXXX 로 적는다.
#   \uc6d0\ubcf8/... = 원본/전처리/입찰제안서_PPT
#   \uc804\ucc98\ub9ac/RFP/... = 전처리/RFP/파싱후
upload.userdata-dir=${upload.base-dir}/userdata
upload.proposal-json-dir=${upload.base-dir}/\uc6d0\ubcf8/\uc804\ucc98\ub9ac/\uc785\ucc30\uc81c\uc548\uc11c_PPT
upload.rfp-md-dir=${upload.base-dir}/\uc804\ucc98\ub9ac/RFP/\ud30c\uc2f1\ud6c4

# 한글 폼값·파일명 인코딩 고정
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
