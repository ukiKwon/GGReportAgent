<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시험 안내 — (주제)</title>
<style>
:root{--ink:#222;--sub:#666;--line:#ddd;--bg:#f6f6f4;--card:#fff;--ok:#1f7a3a;--warn:#a15c00;--acc:#545045}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "맑은 고딕","Malgun Gothic",sans-serif}
header{background:var(--acc);color:#fff;padding:14px 24px}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;font-size:12px;opacity:.85}
main{max-width:1100px;margin:0 auto;padding:16px 24px 40px}

.c{background:var(--card);border:1px solid var(--line);border-radius:4px;margin:0 0 12px;padding:12px 16px}
.c h3{margin:0 0 6px;font-size:18px}.meta{font-size:12px;color:var(--sub);margin-bottom:8px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:2px;margin-right:4px;border:1px solid}
.t-r{color:var(--warn);border-color:var(--warn)}.t-f{color:var(--ok);border-color:var(--ok)}.t-n{color:var(--sub);border-color:var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
th{background:#f0efeb;text-align:center;width:16%}td.chk{width:56px;text-align:center}
code{background:#f0efeb;padding:0 4px;border-radius:2px}
</style></head><body>
<header><h1>(주제) 시험 안내</h1><p>(세션) · (커밋 해시) · 계정: 김영업 3918264 · 이영업(팀장) 5047192 · 마스터 8203417</p></header>
<main>
